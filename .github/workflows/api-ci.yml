name: API checks

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/api-ci.yml"

jobs:
  node-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: synccut_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synccut_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synccut_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        working-directory: apps/api
        run: find src test -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Run API unit and PostgreSQL migration tests
        working-directory: apps/api
        run: npm test

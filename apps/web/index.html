<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SyncCut — 协作素材工作台</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--line:#e7e9ee;--text:#20242b;--muted:#858c98;--accent:#635bff;--soft:#f0efff;--green:#238564}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:20px;font-weight:750;letter-spacing:-.5px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:1px}.presence{color:var(--green);font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.head h1{font-size:26px;margin:0 0 4px}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 13px;font-size:12px}.primary{background:var(--accent);border-color:var(--accent);color:white}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.toolbar{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.filters{display:flex;gap:5px}.filter{border:0;background:transparent;padding:7px 10px;border-radius:8px;color:var(--muted);font-size:12px}.filter.active{background:var(--soft);color:var(--accent)}input[type=search]{border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:190px}.asset{display:grid;grid-template-columns:26px minmax(160px,1fr) 90px 70px 100px;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid #f0f1f3;cursor:pointer}.asset:hover,.asset.selected{background:#faf9ff}.asset:last-child{border:0}.asset strong{display:block;font-size:12px}.asset small{color:var(--muted);font-size:10px}.pill{font-size:10px;color:#615bd0;background:#f0efff;padding:4px 7px;border-radius:6px;width:max-content}.status{font-size:10px;color:var(--green)}.side{padding:17px;position:sticky;top:20px;height:max-content}.side h3{margin:0 0 14px;font-size:14px}.preview{background:linear-gradient(135deg,#f0efff,#f8f8fb);border:1px solid #ecebff;border-radius:12px;padding:14px;margin-bottom:14px}.preview strong{display:block;font-size:12px}.preview button{margin-top:10px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:white}.side-actions{display:flex;gap:7px;flex-wrap:wrap}.selection{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#22242b;color:white;padding:10px 12px;border-radius:13px;align-items:center;gap:8px;box-shadow:0 12px 35px #0002}.selection.show{display:flex}.selection .btn{font-size:11px}.modal{display:none;position:fixed;inset:0;background:#1118;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(460px,100%);background:white;border-radius:16px;padding:22px}.dialog h2{font-size:17px;margin:0 0 8px}.dialog p{font-size:12px;color:var(--muted);line-height:1.7}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:850px){.app{padding:16px}.layout{grid-template-columns:1fr}.side{position:static}.asset{grid-template-columns:24px 1fr 75px}.asset .duration,.asset .status{display:none}.head{align-items:start;gap:12px;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">SyncCut<small>COLLABORATIVE MEDIA WORKSPACE</small></div><div><a href="/feishu.html">飞书连接</a>　<span class="presence">● 演示工作区 · 本地原型</span></div></header>
  <section class="head"><div><h1>项目素材</h1><div class="muted">统一管理音乐、音效、配音与环境音</div></div><div><button class="btn" id="upload">上传音频</button> <button class="btn primary" id="import">批量导入剪映</button></div></section>
  <div class="layout">
    <section class="panel">
      <div class="toolbar"><div class="filters" id="filters"><button class="filter active" data-kind="all">全部</button><button class="filter" data-kind="music">音乐</button><button class="filter" data-kind="sfx">音效</button><button class="filter" data-kind="voice">配音</button><button class="filter" data-kind="ambience">环境音</button></div><input id="search" type="search" placeholder="搜索素材名称或标签"></div>
      <div id="list"></div>
    </section>
    <aside class="panel side">
      <h3>素材详情与套用参数</h3>
      <div class="preview"><strong id="detailName">悬疑氛围音乐 01</strong><div class="muted" id="detailMeta">MP3 · 00:48 · 示例素材</div><button class="btn" id="play">试听选中音频</button></div>
      <div class="field"><label>开始时间（秒）</label><input id="start" type="number" min="0" step="0.1" value="0"></div>
      <div class="field"><label>目标音轨</label><select id="track"><option>A1 · 主音乐</option><option>A2 · 氛围层</option><option>A3 · 动作音效</option><option>A4 · 配音</option></select></div>
      <div class="field"><label>音量（%）</label><input id="volume" type="number" min="0" max="200" value="80"></div>
      <div class="field"><label>淡入 / 淡出（秒）</label><div style="display:flex;gap:8px"><input id="fadeIn" type="number" min="0" step=".1" value="1"><input id="fadeOut" type="number" min="0" step=".1" value="1"></div></div>
      <div class="side-actions"><button class="btn" id="save">保存参数</button><button class="btn primary" id="apply">套用到时间轴</button></div>
      <p class="muted">当前为交互原型，不会连接云端或实际修改剪映工程。</p>
    </aside>
  </div>
</div>
<div class="selection" id="selection"><span id="count">已选择 0 项</span><button class="btn" id="bulkImport">导入素材库</button><button class="btn primary" id="bulkApply">套用时间轴</button><button class="btn" id="clear">取消</button></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">确认操作</h2><p id="modalText"></p><div class="dialog-actions"><button class="btn" id="close">返回</button><button class="btn primary" id="confirm">知道了</button></div></div></div>
<input id="files" type="file" accept="audio/*" multiple hidden>
<audio id="audio" hidden></audio>
<script>
const assets=[
{id:"m1",name:"悬疑氛围音乐 01",kind:"music",duration:48,tags:"悬疑 / 紧张",status:"已同步",start:0,track:"A1 · 主音乐",volume:80,fadeIn:1,fadeOut:1},
{id:"m2",name:"情绪反转音乐 02",kind:"music",duration:72,tags:"反转 / 高潮",status:"有新版本",start:18.5,track:"A1 · 主音乐",volume:72,fadeIn:.5,fadeOut:2},
{id:"s1",name:"清脆玻璃破碎",kind:"sfx",duration:3,tags:"玻璃 / 撞击",status:"已同步",start:24.2,track:"A3 · 动作音效",volume:100,fadeIn:0,fadeOut:0},
{id:"s2",name:"沉重脚步声·大理石",kind:"sfx",duration:8,tags:"脚步 / 室内",status:"已同步",start:11,track:"A3 · 动作音效",volume:90,fadeIn:0,fadeOut:.3},
{id:"v1",name:"男主低声旁白",kind:"voice",duration:19,tags:"旁白 / 男声",status:"有新版本",start:3,track:"A4 · 配音",volume:100,fadeIn:.2,fadeOut:.5},
{id:"a1",name:"宴会厅人群底噪",kind:"ambience",duration:54,tags:"人群 / 宴会",status:"已同步",start:0,track:"A2 · 氛围层",volume:28,fadeIn:1.5,fadeOut:1.5}
];
let current="m1",selected=new Set(),filter="all",localURLs={};
const $=id=>document.getElementById(id),time=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
function visible(){const q=$("search").value.trim().toLowerCase();return assets.filter(a=>(filter==="all"||a.kind===filter)&&(!q||(a.name+" "+a.tags).toLowerCase().includes(q)))}
function render(){const rows=visible();$("list").innerHTML=rows.length?rows.map(a=>'<div class="asset '+(a.id===current?'selected':'')+'" data-id="'+a.id+'"><input type="checkbox" data-check="'+a.id+'" '+(selected.has(a.id)?'checked':'')+'><div><strong>'+a.name+'</strong><small>'+a.tags+'</small></div><span class="pill">'+({music:"音乐",sfx:"音效",voice:"配音",ambience:"环境音"}[a.kind])+'</span><span class="muted">'+time(a.duration)+'</span><span class="status">'+a.status+'</span></div>').join(""):'<div class="empty">没有匹配的素材</div>';
document.querySelectorAll(".asset").forEach(el=>el.onclick=e=>{if(e.target.type==="checkbox")return;current=el.dataset.id;loadDetail();render()});
document.querySelectorAll("[data-check]").forEach(el=>el.onclick=e=>{e.stopPropagation();el.checked?selected.add(el.dataset.check):selected.delete(el.dataset.check);updateSelection()});
updateSelection()}
function loadDetail(){const a=assets.find(x=>x.id===current);if(!a)return;$("detailName").textContent=a.name;$("detailMeta").textContent="本地演示素材 · "+time(a.duration);$("start").value=a.start;$("track").value=a.track;$("volume").value=a.volume;$("fadeIn").value=a.fadeIn;$("fadeOut").value=a.fadeOut;$("audio").src=localURLs[a.id]||""}
function save(){const a=assets.find(x=>x.id===current);if(!a)return;a.start=Number($("start").value)||0;a.track=$("track").value;a.volume=Math.max(0,Math.min(200,Number($("volume").value)||0));a.fadeIn=Math.max(0,Number($("fadeIn").value)||0);a.fadeOut=Math.max(0,Number($("fadeOut").value)||0);$("detailMeta").textContent="套用参数已保存到当前演示界面"}
function updateSelection(){$("count").textContent="已选择 "+selected.size+" 项";$("selection").classList.toggle("show",selected.size>0)}
function showModal(kind){const ids=selected.size?Array.from(selected):[current];$("modalTitle").textContent=kind==="import"?"准备导入剪映素材库":"准备套用到剪映时间轴";$("modalText").textContent="当前选择 "+ids.length+" 项。正式版将创建同步任务，由 Mac 助手下载并校验素材。时间轴套用会先生成工程副本，不覆盖原始工程。当前原型不会实际操作剪映。";$("modal").classList.add("show")}
$("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.kind;$("filters").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()});
$("search").oninput=render;$("save").onclick=save;$("apply").onclick=()=>{save();selected.clear();selected.add(current);updateSelection();showModal("timeline")};
$("import").onclick=()=>showModal("import");$("bulkImport").onclick=()=>showModal("import");$("bulkApply").onclick=()=>showModal("timeline");$("clear").onclick=()=>{selected.clear();updateSelection()};
$("close").onclick=$("confirm").onclick=()=>$("modal").classList.remove("show");
$("upload").onclick=()=>$("files").click();
$("files").onchange=async e=>{for(const f of e.target.files){const id="local-"+Math.random().toString(36).slice(2,8),url=URL.createObjectURL(f),audio=new Audio(url);await new Promise(resolve=>{audio.onloadedmetadata=resolve;audio.onerror=resolve});assets.unshift({id,name:f.name,kind:"music",duration:audio.duration||0,tags:"本地上传",status:"待同步",start:0,track:"A1 · 主音乐",volume:80,fadeIn:0,fadeOut:0});localURLs[id]=url;current=id}loadDetail();render();e.target.value=""};
$("play").onclick=()=>{const a=$("audio");if(!a.src){alert("示例素材没有附带音频文件。请先上传本地音频试听。");return}a.paused?a.play():a.pause()};
render();loadDetail();
</script>
</body>
</html>
